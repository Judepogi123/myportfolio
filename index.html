<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <title>Jude Ribleza — Full-Stack Developer</title>
    <meta
      name="description"
      content="Full-stack developer building and running a municipal information system in production — web, mobile and offline-capable desktop on one API."
    />
    <meta name="author" content="Jude Demnuvar L. Ribleza" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jude Ribleza — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Web, mobile and desktop software in daily production use across nine government departments."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script>
      // Applied before paint so the correct theme never flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersLight =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : prefersLight
              ? 'light'
              : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* private mode — fall through to the dark default on <html> */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
